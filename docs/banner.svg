<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16294a"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa8ce"/>
    </marker>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <rect x="60" y="196" width="70" height="4" rx="2" fill="#5B9BD5"/>

  <text x="60" y="120" fill="#FFFFFF" font-size="58" font-weight="700">ToT&#8209;MARL</text>
  <text x="60" y="160" fill="#AFC6E8" font-size="21">Multi-agent Tree-of-Thought reasoning, built on LangGraph</text>
  <text x="60" y="228" fill="#7E97C0" font-size="17">with a coordination policy trained by MARL, not baked into the LLM</text>

  <g font-size="13" fill="#DCE6F5" text-anchor="middle">
    <line x1="780" y1="160" x2="808" y2="160" stroke="#8fa8ce" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="910" y1="160" x2="938" y2="160" stroke="#8fa8ce" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1040" y1="160" x2="1068" y2="160" stroke="#8fa8ce" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="680" y="135" width="100" height="50" rx="10" fill="#DCE6F5" stroke="#3B5B92" stroke-width="1.5"/>
    <text x="730" y="164" fill="#1F3864" font-weight="600">Scout</text>

    <rect x="810" y="135" width="100" height="50" rx="10" fill="#DCE6F5" stroke="#3B5B92" stroke-width="1.5"/>
    <text x="860" y="164" fill="#1F3864" font-weight="600">Reasoner</text>

    <rect x="940" y="135" width="100" height="50" rx="10" fill="#F6DCE0" stroke="#A03A4E" stroke-width="1.5"/>
    <text x="990" y="164" fill="#7A2436" font-weight="600">Critic</text>

    <rect x="1070" y="135" width="100" height="50" rx="10" fill="#DFF3E1" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="1120" y="164" fill="#1E5A38" font-weight="600">Synthesis</text>

    <path d="M 990 133 C 950 92, 900 92, 860 130" fill="none" stroke="#8fa8ce" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="925" y="88" fill="#7E97C0" font-size="11">prune / backtrack</text>
    <text x="990" y="205" fill="#7E97C0" font-size="12">&#960;&#966; trains here</text>
  </g>
</svg>
